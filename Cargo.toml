[package]
name = "unetic-core"
version = "0.1.0"
edition = "2024"
description = "Unetic control plane for OpenWrt"
repository = "https://github.com/Unetic/unetic-core"
license = "GPL-2.0-only"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ubus = "0.1.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

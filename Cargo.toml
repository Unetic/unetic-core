[package]
name = "unetic-core"
version = "0.1.1"
description = "Unetic control plane for OpenWrt"
repository = "https://github.com/Unetic/unetic-core"
license = "GPL-2.0-only"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ubus = "0.1.7"
unetic-openwrt-sys = { path = "crates/openwrt-sys" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "unetic-core"
version = "0.2.0"
description = "Unetic control plane for OpenWrt"
repository = "https://github.com/Unetic/unetic-core"
license = "GPL-2.0-only"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
futures-util = "0.3.34"
libc = "0.2.189"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33.0"
netlink-sys = "0.9.0"
rtnetlink = "0.23.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ubus = "0.1.7"
unetic-openwrt-sys = { path = "crates/openwrt-sys" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1.24.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
